<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Style/login-and-signup-Design.css">
    <title>Login | Page</title>

    <!-- Google Fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@1..144,1..1000&display=swap" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="./images/images.jpeg">

        <!-- font awesome CDN -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.css" integrity="sha512-x9WwyMYBnlXMNQ6kQ/Lyzu1NqIhLQKL5Oq6xByfXuRj7s9CskyCbLv/1IjqzJmXwFXWr0ov6jBV7Qbc0hh9nHg==" crossorigin="anonymous" referrerpolicy="no-referrer">

</head>
<body>
        <header class="login-box">
            <div class="login-header">
                <header>Login</header>
            </div>

            <div class="input-box">
                <input type="text" class="input-field" placeholder="username" autocomplete="off" required>
            </div>

            <div class="input-box" id="password-box">
                <i class="fa-solid fa-lock"></i>
                <input type="password" class="input-field" placeholder="password" autocomplete="off" required>
            </div>

            <div class="forgot">
                <section>
                    <input type="checkbox" id="check-box">
                    <label for="check-box">Remember me</label>
                </section>

                <section>
                    <a href="#">Forgot Password</a>
                </section>
            </div>

            <div class="input-submit">
                <button class="submit-btn" id="submit-btn">LogIn</button>
            </div>

            <div class="sign-up-link">
                <p>Don't have an account? <a href="./signup.html">Sign Up</a></p>
            </div>
        </header>

</body>
</html>
