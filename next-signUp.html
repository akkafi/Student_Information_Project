<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./Style/login-and-signup-Design.css">
    <title>Next</title>

    <!-- Google Fonts -->
     <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans+Flex:opsz,wght@1..144,1..1000&display=swap" rel="stylesheet">

    <link rel="icon" type="image/x-icon" href="./images.jpeg">

</head>
<body>
    <div class="login-box">
        <div class="input-box">
            <input type="text" class="input-field" placeholder="First Name" autocomplete="off" required>
        </div>

        <div class="input-box">
            <input type="text" class="input-field" placeholder="Last Name" autocomplete="off" required>
        </div>

        <div class="input-box">
            <input type="text" class="input-field" placeholder="User Name" autocomplete="off" required>
        </div>

        <div class="input-box">
            <input type="email" class="input-field" placeholder="Enter Your email" autocomplete="off" required>
        </div>

        <div class="input-submit">
            <button class="submit-btn" id="submit-btn"><a href="./signUp-page.html">Next</a></button>
        </div>


        <div class="sign-up-link">
            <p>Already have an account? <a href="./Login-Page.html">Sign In</a></p>
        </div>
    </div>
</body>
</html>
